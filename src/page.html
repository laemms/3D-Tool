<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gebäudemodell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: Werkzeug für den Energieberater, ruhig und präzise, wie das Bestandsaufnahme-Tool
   IDEA: ein Planblatt – Grundriss mit Wandstärken, rechts die Eigenschaften der Auswahl
   PICTURE: der Grundriss bzw. das 3D-Modell selbst, groß, oben
   COLOUR and TYPE: Farben und Schrift des Bestandsaufnahme-Tools (Grün #0b8a5f, Plus Jakarta Sans)
   LAYOUT: Werkzeugleiste, Plan links breit, Eigenschaften und Räume rechts; unter 900px untereinander */
:root{color-scheme:light dark;--bg:light-dark(#f1f4f2,#090d0b);--card:light-dark(#fff,#111814);--ink:light-dark(#0e1512,#ecf2ee);--mute:light-dark(#5b6b63,#9fb0a7);--line:light-dark(rgba(14,21,18,.10),rgba(255,255,255,.09));--line2:light-dark(rgba(14,21,18,.18),rgba(255,255,255,.18));--accent:light-dark(#0b8a5f,#2fd49a);--soft:light-dark(#dcf4e8,#11302a);--wall:light-dark(#26332d,#c9d6cf);--wallin:light-dark(#7d8c85,#7b8d84);--room:light-dark(#e9f6ef,#14231c);--bad:light-dark(#c0281f,#ff8a80);--warn:light-dark(#9a6200,#f5c46a);--win:light-dark(#2f7fc1,#86c0f0);--door:light-dark(#8a5a2b,#dba86e);--sel:light-dark(#e07a00,#ffb44d);--w3e:light-dark(#c3cec8,#5d6d65);--w3i:light-dark(#e2e9e5,#43514a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;font-weight:700}
header a{color:var(--accent);text-decoration:none;font-weight:600}
.sync{margin-inline-start:auto;font-size:13px;color:var(--mute)}.sync.ok{color:var(--accent)}.sync.warn{color:var(--warn)}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px max(3vw,16px);max-width:1440px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar+.bar{margin-top:8px}
.sep{width:1px;align-self:stretch;background:var(--line2);margin:0 4px}
select,button,input{font:inherit;font-size:15px;min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:0 11px}
input{width:6.5em;font-size:16px;font-variant-numeric:tabular-nums}
input.wide{width:100%}
button{cursor:pointer;font-weight:600;white-space:nowrap}button.pri{background:var(--accent);color:light-dark(#fff,#04140d);border-color:transparent}
button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
button.danger{color:var(--bad)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
label.f{display:grid;gap:2px;font-size:13px;color:var(--mute)}label.f>*{color:var(--ink)}
.fig{position:relative;height:clamp(360px,64vh,760px);border-radius:10px;background:var(--bg);overflow:hidden;touch-action:none;margin-top:10px;user-select:none}
.fig>svg,.fig>canvas{position:absolute;inset:0;width:100%;height:100%}
.fig svg{cursor:crosshair}.fig svg.sel{cursor:default}
.hint{position:absolute;left:10px;bottom:10px;right:10px;font-size:13px;color:var(--mute);pointer-events:none}
.zoom{position:absolute;right:10px;top:64px;display:grid;gap:6px;z-index:2}
.views{position:absolute;right:10px;top:10px;z-index:2}
.opts{position:absolute;left:10px;top:10px;right:120px;z-index:2;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:12px;padding:6px}
.opts input{width:5.5em}
.zoom button{min-width:44px;padding:0}
h2{font-size:17px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.on td{background:var(--soft)}
.ok{color:var(--accent)}.no{color:var(--bad)}.warn{color:var(--warn)}
.small{font-size:13px;color:var(--mute)}
.side{display:grid;gap:16px;align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 input,.grid2 select{width:100%}
.msg{margin:8px 0 0;font-size:14px}
dialog{border:1px solid var(--line2);border-radius:14px;background:var(--card);color:var(--ink);max-width:420px}
dialog::backdrop{background:rgba(0,0,0,.35)}
</style>
</head>
<body>
<header><a href="index.html">‹ Bestandsaufnahme</a><h1>Gebäudemodell</h1><span class="small" id="stand">Phase A · Test</span><span id="sync" class="sync">Verbinde …</span></header>
<main>
  <section class="card">
    <div class="bar">
      <select id="proj" aria-label="Projekt"></select>
      <span id="floors" class="bar"></span>
      <span class="sep"></span>
      <button id="t-sel" data-tool="sel" aria-pressed="true">Auswahl</button>
      <button id="t-wall" data-tool="wall" aria-pressed="false">Wand</button>
      <button id="t-open" data-tool="open" aria-pressed="false">Öffnung</button>
      <span class="sep"></span>
      <button id="undo" title="Rückgängig (Strg+Z)" disabled>↶</button><button id="redo" title="Wiederholen (Strg+Y)" disabled>↷</button>
    </div>
    <div class="fig" id="fig">
    <div class="opts bar" id="wallbar" hidden>
      <select id="w-typ" aria-label="Wandtyp"><option value="aussen">Außenwand</option><option value="innen">Innenwand</option></select>
      <label class="small" for="w-t">Dicke cm</label><input id="w-t" inputmode="decimal" value="36,5">
      <select id="w-bezug" aria-label="Bezug der Maße"><option value="innen">Maße innen</option><option value="mitte">Maße Wandmitte</option><option value="aussen">Maße außen</option></select>
      <button id="w-ortho" aria-pressed="true" title="Nur rechte Winkel">90°</button>
      <span class="sep"></span>
      <label class="small" for="w-len">Länge m</label><input id="w-len" inputmode="decimal" placeholder="z. B. 8,49">
      <button data-dir="0" title="nach rechts">→</button><button data-dir="90" title="nach unten">↓</button><button data-dir="180" title="nach links">←</button><button data-dir="270" title="nach oben">↑</button>
      <button id="w-done">Fertig</button>
    </div>
    <div class="opts bar" id="openbar" hidden>
      <select id="o-typ" aria-label="Öffnungstyp"><option value="fenster">Fenster</option><option value="fenstertuer">Fenstertür</option><option value="innentuer">Innentür</option><option value="aussentuer">Außentür</option></select>
      <label class="small" for="o-b">Breite m</label><input id="o-b" inputmode="decimal" value="1,20">
      <label class="small" for="o-h">Höhe m</label><input id="o-h" inputmode="decimal" value="1,40">
      <label class="small" for="o-brh">Brüstung m</label><input id="o-brh" inputmode="decimal" value="0,90">
    </div>
      <svg id="plan" role="img" aria-label="Grundriss des Gebäudemodells"></svg><canvas id="c3d" hidden></canvas>
      <div class="views bar"><button id="v2d" aria-pressed="true">2D</button><button id="v3d" aria-pressed="false">3D</button></div>
      <div class="zoom" id="zoombox"><button id="z-in" aria-label="Vergrößern">+</button><button id="z-out" aria-label="Verkleinern">−</button><button id="z-fit" aria-label="Ganzen Grundriss zeigen">⤢</button></div>
      <div class="hint" id="hint"></div>
    </div>
  </section>
  <aside class="side">
    <section class="card" id="props"><h2>Auswahl</h2><p class="small">Wand, Öffnung oder Raum antippen.</p></section>
    <section class="card"><h2>Räume</h2><div id="rooms"></div></section>
    <section class="card"><h2>Modell</h2>
      <div class="bar"><button class="pri" id="save">Speichern</button><button id="ifc">IFC exportieren</button><button id="reimport" title="Modell aus den Räumen der Bestandsaufnahme neu erzeugen">Neu übernehmen</button></div>
      <p class="msg small" id="saveinfo"></p>
    </section>
  </aside>
</main>
<dialog id="dlg"><p id="dlg-t"></p><div class="bar" style="justify-content:flex-end"><button id="dlg-no">Abbrechen</button><button class="pri" id="dlg-yes">Übernehmen</button></div></dialog>
<script>/*CORE*/</script>
<script>/*IFC*/</script>
<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 2) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const num = s => { const v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? null : v; };
const MODEL_VERSION = 1;
window.__gm = null;
const st = { db: null, projects: {}, models: {}, pid: null, fid: null, floors: [], tool: 'sel', view: '2d', sel: null, chain: null, hover: null, drag: null, pan: null, vw: null, undo: [], redo: [], dirty: false, saveTimer: null, t3: null, lastDir: 0 };

/* ---------- Laden ---------- */
function setSync(t, cls) { const e = $('sync'); e.textContent = t; e.className = 'sync ' + (cls || ''); }
async function init() {
  let db = null; try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  st.db = db;
  if (!db) { // lokale Datei: dieselben Browser-Daten wie das Bestandsaufnahme-Tool (Schlüssel ba.v1)
    st.local = true; loadLocal(); setSync('Lokal: Daten aus der Bestandsaufnahme auf diesem Gerät', 'ok');
    window.addEventListener('storage', e => { if (e.key === LS) { const cur = st.pid; loadLocal(true); if (st.projects[cur]) st.pid = cur; } });
  } else try {
    const tm = new Promise((_, rej) => setTimeout(() => rej(new Error('Zeitüberschreitung')), 10000));
    const [sp, sm] = await Promise.race([Promise.all([db.collection('projekte').get(), db.collection('modell').get()]), tm]);
    sp.docs.forEach(d => { const x = d.data(); if (x && x.id && Array.isArray(x.geschosse)) st.projects[x.id] = x; });
    sm.docs.forEach(d => { const x = d.data(); if (x && x.id) st.models[x.id] = x; });
    try { const fs = await db.doc('einstellungen/firma').get(); if (fs.exists) st.firma = (fs.data() || {}).firma || {}; } catch (e) { /* ohne Einstellungen weiter */ }
    setSync('Verbunden', 'ok');
  } catch (e) { setSync('Datenbank nicht erreichbar: ' + e.message, 'warn'); }

}
const LS = 'ba.v1', LSM = 'ba.v1.modell';
function loadLocal(keep) {
  try { const all = JSON.parse(localStorage.getItem(LS) || '{}') || {}; st.projects = {}; Object.values(all).forEach(x => { if (x && x.id && Array.isArray(x.geschosse)) st.projects[x.id] = x; }); } catch (e) { st.projects = {}; }
  try { st.models = JSON.parse(localStorage.getItem(LSM) || '{}') || {}; } catch (e) { st.models = {}; }

}
function fillProjects(keep) {

  $('proj').innerHTML = ids.map(id => `<option value="${esc(id)}">${esc(st.projects[id].name || id)}</option>`).join('');
  if (!ids.length) { $('rooms').innerHTML = '<p class="small">Keine Projekte gefunden. Öffne zuerst das Bestandsaufnahme-Tool aus demselben Ordner und lege dort ein Projekt an.</p>'; return; }

  selectProject(ids[0]);
}
function fromBA(p) {
  return p.geschosse.map(f => { const r = GM.fromBestandsaufnahme(p, f), g = r.graph; g.waende.forEach(w => delete w.src); g.oeffnungen.forEach(o => delete o.quelle);
    const meta = r.raeume.map(x => { const q = x.bestandsaufnahme; return { name: q ? q.name : 'Raum', nutzung: q ? q.nutzung || '' : '', temp: q ? q.temp : null, beheizt: q ? q.beheizt : null, bestandsaufnahmeId: q ? q.id : null, mitte: GM.centroid(x.kontur).map(Math.round), soll: q ? q.flaeche_m2 : null }; });
    return { id: f.id, name: f.name || 'Geschoss', h: Math.round((f.geschossHoehe || 2.8) * 1000), g, meta }; });
}
function selectProject(pid) {
  st.pid = pid; $('proj').value = pid; const p = st.projects[pid], m = st.models[pid];
  if (m && m.version >= MODEL_VERSION) st.floors = p.geschosse.map(f => { const x = (m.geschosse || []).find(y => y.id === f.id) || { knoten: [], waende: [], oeffnungen: [], raeume: [] }; return { id: f.id, name: f.name || 'Geschoss', h: x.geschossHoehe_mm || Math.round((f.geschossHoehe || 2.8) * 1000), g: { knoten: x.knoten || [], waende: x.waende || [], oeffnungen: x.oeffnungen || [] }, meta: x.raeume || [] }; });
  else { st.floors = fromBA(p); st.dirty = !!st.db || !!st.local; }
  const fs = st.floors.filter(f => f.g.waende.length);
  st.fid = (fs.find(f => /^(eg|erd)/i.test(f.name)) || fs[0] || st.floors[0] || {}).id;
  st.undo = []; st.redo = []; st.sel = null; st.chain = null; st.vw = null;
  $('floors').innerHTML = st.floors.map(f => `<button data-f="${esc(f.id)}" aria-pressed="${f.id === st.fid}">${esc(f.name)}</button>`).join('');
  $('saveinfo').textContent = m && m.version >= MODEL_VERSION ? 'Gespeichertes Modell geladen (' + new Date(m.geaendert || 0).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) + ').' : 'Aus der Bestandsaufnahme übernommen, noch nicht gespeichert.';
  if (st.dirty) scheduleSave();
  refresh(true);
}
const fl = () => st.floors.find(f => f.id === st.fid);

/* ---------- Änderungen, Rückgängig, Speichern ---------- */
function change(fn) {
  const f = fl(); if (!f) return; const before = JSON.stringify({ g: f.g, meta: f.meta });
  const g2 = fn(f.g); if (!g2 || g2 === f.g) return;
  st.undo.push({ fid: f.id, s: before }); if (st.undo.length > 80) st.undo.shift(); st.redo = [];
  f.g = g2; f.meta = GM.roomsWithMeta(f.g, f.meta).map(metaOf); st.dirty = true; scheduleSave(); refresh();
}
const metaOf = r => ({ name: r.name, nutzung: r.nutzung, temp: r.temp, beheizt: r.beheizt, bestandsaufnahmeId: r.bestandsaufnahmeId, mitte: r.mitte, soll: (fl().meta.find(m => m.bestandsaufnahmeId && m.bestandsaufnahmeId === r.bestandsaufnahmeId) || {}).soll ?? null });
function undoRedo(from, to) { const e = from.pop(); if (!e) return; const f = st.floors.find(x => x.id === e.fid); if (!f) return; to.push({ fid: f.id, s: JSON.stringify({ g: f.g, meta: f.meta }) }); const o = JSON.parse(e.s); f.g = o.g; f.meta = o.meta; if (st.fid !== f.id) selectFloor(f.id); st.sel = null; st.dirty = true; scheduleSave(); refresh(); }
function scheduleSave() { if (!st.db && !st.local) return; clearTimeout(st.saveTimer); setSync('Ungespeichert', 'warn'); st.saveTimer = setTimeout(save, 1500); }
function modelDoc() { const p = st.projects[st.pid]; return { id: p.id, projektName: p.name || '', version: MODEL_VERSION, quelle: 'Gebäudemodell', geaendert: Date.now(), geschosse: st.floors.map(f => { const rs = GM.roomsWithMeta(f.g, f.meta), bf = p.geschosse.find(x => x.id === f.id) || {}; return { id: f.id, name: f.name, geschossHoehe_mm: f.h, lichteHoehe_mm: bf.hoehe ? Math.round(bf.hoehe * 1000) : null, knoten: f.g.knoten, waende: f.g.waende, oeffnungen: f.g.oeffnungen, raeume: rs.map(r => ({ ...metaOf(r), flaeche_m2: Math.round(r.flaeche_m2 * 100) / 100, kontur: r.kontur })) }; }) }; }
/* IFC: in den Übergabeordner der Bestandsaufnahme schreiben (lokaler Dateiserver der Claude-App, wie dort).
   Ohne Dateiserver: als ZIP herunterladen, weil der Download-Dienst .ifc nicht annimmt. */
const strs = (v, out = []) => { if (typeof v === 'string') out.push(v); else if (Array.isArray(v)) v.forEach(x => strs(x, out)); else if (v && typeof v === 'object') Object.values(v).forEach(x => strs(x, out)); return out; };
const pjoin = (dir, name) => dir.replace(/[\\/]+$/, '') + ((dir.includes('\\') || /^[A-Za-z]:/.test(dir)) ? '\\' : '/') + name;
function fsMsg(e) { const c = e && e.code; return c === 'server_not_connected' ? 'Der lokale Dateizugriff ist hier nicht erreichbar (Seite im Browser statt in der Claude-App geöffnet?).'
  : c === 'cancelled' ? 'Abgebrochen.' : ['not_in_manifest', 'not_granted', 'approval_required', 'consent_required'].includes(c) ? 'Der Zugriff auf den lokalen Dateiserver wurde nicht erlaubt.'
  : c === 'blocked_by_policy' ? 'Der Zugriff ist durch eine Richtlinie gesperrt.' : c === 'tool_error' ? 'Der Dateiserver hat das Schreiben abgelehnt: ' + String(e.message || '').slice(0, 160)
  : 'Übergabe fehlgeschlagen (' + (c || (e && e.message) || 'unbekannter Fehler') + ').'; }
/* ZIP ohne Kompression (eine Datei) */
function zipOne(name, text) {
  const data = new TextEncoder().encode(text), fn = new TextEncoder().encode(name), crcT = zipOne.t || (zipOne.t = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; }));
  let crc = 0xFFFFFFFF; for (const b of data) crc = crcT[(crc ^ b) & 0xFF] ^ (crc >>> 8); crc = (crc ^ 0xFFFFFFFF) >>> 0;
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const hdr = (sig, central) => { const b = new DataView(new ArrayBuffer(central ? 46 : 30)); let o = 0; const u32 = v => { b.setUint32(o, v, true); o += 4; }, u16 = v => { b.setUint16(o, v, true); o += 2; };
    u32(sig); if (central) u16(20); u16(20); u16(0x0800); u16(0); u16(time); u16(date); u32(crc); u32(data.length); u32(data.length); u16(fn.length); u16(0); if (central) { u16(0); u16(0); u16(0); u32(0); u32(0); } return new Uint8Array(b.buffer); };
  const loc = hdr(0x04034b50, false), cen = hdr(0x02014b50, true), off = loc.length + fn.length + data.length, end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true); end.setUint32(12, cen.length + fn.length, true); end.setUint32(16, off, true);
  return new Blob([loc, fn, data, cen, fn, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
/* lokal: Ordnerzugriff aus der Bestandsaufnahme (IndexedDB ba-fotos, Schlüssel scdir) wiederverwenden, sonst wählen lassen */
function idbDo(mode, fn) { return new Promise(res => { try { const q = indexedDB.open('ba-fotos', 1); q.onupgradeneeded = () => q.result.createObjectStore('f'); q.onerror = () => res(undefined); q.onsuccess = () => { try { const tx = q.result.transaction('f', mode), rq = fn(tx.objectStore('f')); tx.oncomplete = () => res(rq.result); tx.onerror = () => res(undefined); } catch (e) { res(undefined); } }; } catch (e) { res(undefined); } }); }
async function saveLocalFile(name, txt) {
  if (window.showDirectoryPicker) {
    let h = await idbDo('readonly', s => s.get('scdir')); if (!h || !h.getFileHandle) { h = await window.showDirectoryPicker({ mode: 'readwrite' }); await idbDo('readwrite', s => s.put(h, 'scdir')); }
    if (h.queryPermission && await h.queryPermission({ mode: 'readwrite' }) !== 'granted' && await h.requestPermission({ mode: 'readwrite' }) !== 'granted') throw new Error('Zugriff auf den Ordner nicht erlaubt');

  return 'IFC heruntergeladen: ' + name;
}
async function exportIfc() {

    el.innerHTML = head('Raum') + `<div class="grid2"><label class="f" style="grid-column:1/-1">Name<input class="wide" id="p-n" value="${esc(r.name)}"></label><label class="f">Nutzung<input id="p-u" value="${esc(r.nutzung || '')}"></label><label class="f">Soll °C<input id="p-temp" inputmode="decimal" value="${r.temp == null ? '' : nf(r.temp, 0)}"></label><label class="f">Fläche m²<input value="${nf(r.flaeche_m2)}" disabled></label></div>`;
    const upd = patch => { const rs = GM.roomsWithMeta(f.g, f.meta).map(metaOf), i = rs.findIndex(x => GM.inPoly(x.mitte, r.kontur)); if (i < 0) return; const before = JSON.stringify({ g: f.g, meta: f.meta }); st.undo.push({ fid: f.id, s: before }); st.redo = []; Object.assign(rs[i], patch); f.meta = rs; st.dirty = true; scheduleSave(); renderRooms(); draw2d(); updButtons(); };
    $('p-n').onchange = e => upd({ name: e.target.value.trim() || r.name }); $('p-u').onchange = e => upd({ nutzung: e.target.value.trim() }); $('p-temp').onchange = e => upd({ temp: num(e.target.value) }); }
}
function updButtons() { $('undo').disabled = !st.undo.length; $('redo').disabled = !st.redo.length; }
function hintText() { $('hint').textContent = st.view === '3d' ? 'Ziehen dreht, Mausrad zoomt.' : st.tool === 'wall' ? (st.chain ? 'Nächsten Punkt antippen oder Länge + Richtung · Esc oder „Fertig“ beendet' : 'Ersten Punkt antippen') : st.tool === 'open' ? 'Wand antippen, um die Öffnung zu setzen' : 'Ziehen auf leerer Fläche verschiebt den Plan · Mausrad zoomt'; }
function refresh(refit) { if (refit) st.vw = null; const f = fl(); if (!f) return; st.view === '3d' ? draw3d() : draw2d(); renderRooms(); renderProps(); updButtons(); hintText(); $('wallbar').hidden = st.tool !== 'wall'; $('openbar').hidden = st.tool !== 'open'; }

/* ---------- Zeiger ---------- */
const svg = $('plan');
svg.addEventListener('pointerdown', e => {
  if (!st.vw) return; const p = toW(e); svg.setPointerCapture(e.pointerId);
  if (st.tool === 'wall') { const sp = snap(p, st.chain ? st.chain.pts[st.chain.pts.length - 1] : null); placePoint(sp.p); return; }
  if (st.tool === 'open') { const h = hit(p); if (h && h.kind === 'wall') { const ob = { typ: $('o-typ').value, breite: Math.round((num($('o-b').value) || 1) * 1000), hoehe: Math.round((num($('o-h').value) || 1.4) * 1000), brh: Math.round((num($('o-brh').value) || 0) * 1000) }; const f = fl(); const before = f.g.oeffnungen.length; change(g => GM.edit.addOpening(g, h.id, h.s, ob)); if (fl().g.oeffnungen.length > before) st.sel = { kind: 'open', id: fl().g.oeffnungen[fl().g.oeffnungen.length - 1].id }; refresh(); } return; }
  const h = hit(p);
  if (h && h.kind === 'node') { st.drag = { id: h.id, p: p, moved: false, x0: e.clientX, y0: e.clientY }; return; }
  if (h) { st.sel = h.kind === 'room' ? { kind: 'room', mitte: h.mitte } : { kind: h.kind, id: h.id }; refresh(); return; }
  st.sel = null; st.pan = { x: e.clientX, y: e.clientY, ox: st.vw.ox, oy: st.vw.oy }; refresh();
});
svg.addEventListener('pointermove', e => {
  if (!st.vw) return; const p = toW(e);
  if (st.pan) { st.vw.ox = st.pan.ox + e.clientX - st.pan.x; st.vw.oy = st.pan.oy + e.clientY - st.pan.y; draw2d(); return; }
  if (st.drag) { if (Math.hypot(e.clientX - st.drag.x0, e.clientY - st.drag.y0) > 4) st.drag.moved = true; if (st.drag.moved) { const others = fl().g.knoten.filter(n => n.id !== st.drag.id); let q = p.map(v => Math.round(v / 10) * 10); for (const n of others) if (Math.hypot(n.x - p[0], n.y - p[1]) < px(12)) q = [n.x, n.y]; st.drag.p = q; draw2d(); } return; }
  if (st.tool !== 'sel') { st.hover = snap(p, st.tool === 'wall' && st.chain ? st.chain.pts[st.chain.pts.length - 1] : null).p; if (st.tool === 'open') { const h = hit(p); st.hover = h && h.kind === 'wall' ? st.hover : null; } draw2d(); }
});
svg.addEventListener('pointerup', () => {
  if (st.drag) { const d = st.drag; st.drag = null; if (d.moved) change(g => GM.edit.moveNode(g, d.id, d.p[0], d.p[1])); else { st.sel = null; draw2d(); } }
  st.pan = null;
});
svg.addEventListener('pointerleave', () => { if (st.tool !== 'sel') { st.hover = null; draw2d(); } });
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.deltaY > 0 ? 1 / 1.15 : 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });

/* ---------- 3D ---------- */
async function three() { if (window.THREE) return true; try { await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); } catch (e) { $('hint').textContent = '3D-Bibliothek konnte nicht geladen werden.'; } return !!window.THREE; }
async function draw3d() {
  const cv = $('c3d'); if (!(await three())) return; const T = window.THREE, f = fl(), g = f.g, N = new Map(g.knoten.map(n => [n.id, n])), Hw = f.h || 2800;
  if (!st.t3) {
    const rnd = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true }), scene = new T.Scene(), cam = new T.PerspectiveCamera(40, 1, 100, 200000);
    scene.add(new T.HemisphereLight(0xffffff, 0x8a9a92, 0.9)); const sun = new T.DirectionalLight(0xffffff, 0.6); sun.position.set(-1, 2, 1.5); scene.add(sun);
    st.t3 = { rnd, scene, cam, grp: null, rot: 1.15, tilt: 0.7, dist: 20000, c: [0, 0, 0] };
    let drag = null; cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (!drag) return; const t = st.t3; t.rot -= (e.clientX - drag[0]) * 0.008; t.tilt = Math.max(0.1, Math.min(1.45, t.tilt + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; frame(); });
    cv.addEventListener('pointerup', () => { drag = null; });
    cv.addEventListener('wheel', e => { e.preventDefault(); st.t3.dist = Math.max(3000, Math.min(120000, st.t3.dist * (e.deltaY > 0 ? 1.1 : 0.9))); frame(); }, { passive: false });
  }
  const t = st.t3; if (t.grp) t.scene.remove(t.grp); const grp = new T.Group(); t.grp = grp;
  const probe = document.createElement('i'); document.body.appendChild(probe); const col = v => { probe.style.color = `var(${v})`; return new T.Color(getComputedStyle(probe).color); };
  const mExt = new T.MeshLambertMaterial({ color: col('--w3e') }), mIn = new T.MeshLambertMaterial({ color: col('--w3i') }), mFl = new T.MeshLambertMaterial({ color: col('--room'), side: T.DoubleSide }), mWin = new T.MeshLambertMaterial({ color: col('--win'), transparent: true, opacity: 0.45 }); probe.remove();
  const piece = (w, s0, s1, z0, z1, m) => { if (s1 - s0 < 5 || z1 - z0 < 5) return; const a = N.get(w.a), b = N.get(w.b), L = Math.hypot(b.x - a.x, b.y - a.y), u = [(b.x - a.x) / L, (b.y - a.y) / L], S = [-u[1], u[0]], ts = w.ts == null ? w.t / 2 : w.ts, sh = ts - w.t / 2, c = (s0 + s1) / 2;
    const mesh = new T.Mesh(new T.BoxGeometry(s1 - s0, z1 - z0, Math.max(w.t, 20)), m); mesh.position.set(a.x + u[0] * c + S[0] * sh, (z0 + z1) / 2, a.y + u[1] * c + S[1] * sh); mesh.rotation.y = -Math.atan2(u[1], u[0]); grp.add(mesh); };
  for (const w of g.waende) { const a = N.get(w.a), b = N.get(w.b), L = Math.hypot(b.x - a.x, b.y - a.y), m = w.ext ? mExt : mIn, ops = g.oeffnungen.filter(o => o.wand === w.id).map(o => ({ ...o, s0: Math.max(0, o.abstand), s1: Math.min(L, o.abstand + o.breite) })).sort((x, y) => x.s0 - y.s0);
    let c = 0; for (const o of ops) { piece(w, c, o.s0, 0, Hw, m); piece(w, o.s0, o.s1, 0, o.brh, m); piece(w, o.s0, o.s1, o.brh + o.hoehe, Hw, m); if (!/tuer/.test(o.typ || '')) piece(w, o.s0, o.s1, o.brh, o.brh + o.hoehe, mWin); c = o.s1; } piece(w, c, L, 0, Hw, m); }
  for (const c of GM.nodeCaps(g)) { const geo = new T.ExtrudeGeometry(new T.Shape(c.poly.map(q => new T.Vector2(q[0], q[1]))), { depth: Hw, bevelEnabled: false }), ms = new T.Mesh(geo, c.ext ? mExt : mIn); ms.rotation.x = Math.PI / 2; ms.position.y = Hw; grp.add(ms); }
  for (const r of GM.rooms(g)) { const ms = new T.Mesh(new T.ShapeGeometry(new T.Shape(r.kontur.map(q => new T.Vector2(q[0], q[1])))), mFl); ms.rotation.x = Math.PI / 2; grp.add(ms); }
  let x0 = 1e12, z0 = 1e12, x1 = -1e12, z1 = -1e12; g.knoten.forEach(n => { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); z0 = Math.min(z0, n.y); z1 = Math.max(z1, n.y); }); if (x1 < x0) { x0 = z0 = 0; x1 = z1 = 8000; }
  t.c = [(x0 + x1) / 2, 1000, (z0 + z1) / 2]; t.dist = Math.max(x1 - x0, z1 - z0) * 1.9 + 4000; t.scene.add(grp); frame();
}
function frame() { const t = st.t3, cv = $('c3d'); if (!t) return; const w = cv.clientWidth || 800, h = cv.clientHeight || 500; t.rnd.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); t.rnd.setSize(w, h, false); t.cam.aspect = w / h; t.cam.updateProjectionMatrix(); t.cam.position.set(t.c[0] + Math.cos(t.rot) * Math.cos(t.tilt) * t.dist, t.c[1] + Math.sin(t.tilt) * t.dist, t.c[2] + Math.sin(t.rot) * Math.cos(t.tilt) * t.dist); t.cam.lookAt(t.c[0], t.c[1], t.c[2]); t.rnd.render(t.scene, t.cam); }

/* ---------- Bedienelemente ---------- */
function selectFloor(id) { st.fid = id; st.sel = null; st.chain = null; [...$('floors').children].forEach(x => x.setAttribute('aria-pressed', x.dataset.f === id)); refresh(true); }
function setTool(t) { if (st.chain) endChain(false); st.tool = t; st.hover = null; ['sel', 'wall', 'open'].forEach(k => $('t-' + k).setAttribute('aria-pressed', k === t)); if (t !== 'sel') setView('2d'); refresh(); }
function setView(v) { st.view = v; $('v2d').setAttribute('aria-pressed', v === '2d'); $('v3d').setAttribute('aria-pressed', v === '3d'); $('plan').toggleAttribute('hidden', v !== '2d'); $('c3d').toggleAttribute('hidden', v !== '3d'); $('zoombox').hidden = v !== '2d'; refresh(); }
function confirmBox(text) { return new Promise(res => { const d = $('dlg'); $('dlg-t').textContent = text; d.showModal(); const done = v => { d.close(); $('dlg-yes').onclick = $('dlg-no').onclick = null; res(v); }; $('dlg-yes').onclick = () => done(true); $('dlg-no').onclick = () => done(false); }); }
$('proj').addEventListener('change', e => { if (st.dirty) save(); selectProject(e.target.value); });
$('floors').addEventListener('click', e => { const b = e.target.closest('button[data-f]'); if (b) selectFloor(b.dataset.f); });
['sel', 'wall', 'open'].forEach(k => $('t-' + k).addEventListener('click', () => setTool(k)));
$('v2d').addEventListener('click', () => setView('2d')); $('v3d').addEventListener('click', () => { if (st.tool !== 'sel') setTool('sel'); setView('3d'); });
$('undo').addEventListener('click', () => undoRedo(st.undo, st.redo)); $('redo').addEventListener('click', () => undoRedo(st.redo, st.undo));
$('z-in').addEventListener('click', () => zoomAt(1.3, svg.clientWidth / 2, svg.clientHeight / 2)); $('z-out').addEventListener('click', () => zoomAt(1 / 1.3, svg.clientWidth / 2, svg.clientHeight / 2)); $('z-fit').addEventListener('click', () => { st.vw = null; draw2d(); });
$('w-typ').addEventListener('change', e => { $('w-t').value = e.target.value === 'aussen' ? '36,5' : '11,5'; $('w-bezug').disabled = e.target.value !== 'aussen'; });
$('w-ortho').addEventListener('click', e => e.currentTarget.setAttribute('aria-pressed', e.currentTarget.getAttribute('aria-pressed') !== 'true'));
document.querySelectorAll('#wallbar [data-dir]').forEach(b => b.addEventListener('click', () => placeByLength(+b.dataset.dir)));
$('w-len').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); placeByLength(null); } });
$('w-done').addEventListener('click', () => endChain(false));
$('o-typ').addEventListener('change', e => { const d = { fenster: ['1,20', '1,40', '0,90'], fenstertuer: ['1,00', '2,10', '0,00'], innentuer: ['0,885', '2,01', '0,00'], aussentuer: ['1,01', '2,135', '0,00'] }[e.target.value]; $('o-b').value = d[0]; $('o-h').value = d[1]; $('o-brh').value = d[2]; });
$('save').addEventListener('click', save); $('ifc').addEventListener('click', exportIfc);
$('reimport').addEventListener('click', async () => { if (!(await confirmBox('Das Modell dieses Projekts wird aus den Räumen der Bestandsaufnahme neu erzeugt. Eigene Änderungen am Modell gehen verloren.'))) return; st.floors = fromBA(st.projects[st.pid]); st.undo = []; st.redo = []; st.sel = null; st.dirty = true; scheduleSave(); refresh(true); });
document.addEventListener('keydown', e => {
  const inField = /INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !inField) { e.preventDefault(); undoRedo(st.undo, st.redo); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !inField) { e.preventDefault(); undoRedo(st.redo, st.undo); return; }
  if (e.key === 'Escape') { if (st.chain) endChain(false); else { st.sel = null; refresh(); } return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !inField && st.sel) { const s = st.sel; st.sel = null; if (s.kind === 'wall') change(g => GM.edit.deleteWall(g, s.id)); else if (s.kind === 'open') change(g => GM.edit.deleteOpening(g, s.id)); else refresh(); }
});
new ResizeObserver(() => { if (st.view === '2d') draw2d(); else frame(); }).observe($('fig'));
window.addEventListener('pagehide', () => { if (st.dirty) save(); });
window.__gm = { st, hit: p => hit(p) };
init();
}
</script>
