<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gebäudemodell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Gebäudemodell – minimalistisches Planungswerkzeug
   IDEE: Planblatt. Der Grundriss füllt den ganzen Bildschirm (graues Blatt mit 1-m-Punktraster, Räume weiß, Wände als
   dunkle Poché), alle Bedienelemente schweben ruhig darüber: oben Projekt, Geschoss, Ansicht und Export, links die
   Werkzeuge, rechts eine Seitenleiste mit Registern. Einzige Akzentfarbe ist das Grün der Marke (#0b8a5f).
   SCHRIFT: Plus Jakarta Sans wie im Bestandsaufnahme-Tool, Zahlen tabellarisch. */
:root{color-scheme:light dark;
  --paper:light-dark(#eef1ef,#0b100e);--surface:light-dark(#ffffff,#141b18);--ink:light-dark(#18211d,#e8efeb);--mute:light-dark(#66736d,#93a39b);
  --line:light-dark(#e2e7e4,#232d29);--line2:light-dark(#cdd5d1,#33403a);--accent:light-dark(#0b8a5f,#34d39b);--soft:light-dark(#e2f3ea,#10302a);
  --wall:light-dark(#1f2a25,#d5e0da);--wallin:light-dark(#8d9993,#6f8079);--room:light-dark(#ffffff,#121a16);--dot:light-dark(#cbd3cf,#26302c);--axis:light-dark(#b9c3be,#3a4842);
  --bad:light-dark(#c0281f,#ff8a80);--warn:light-dark(#a35f00,#f5c46a);--win:light-dark(#2b78c2,#86c0f0);--door:light-dark(#9c6230,#dba86e);--sel:var(--accent);
  --roof:light-dark(#5f6b66,#7d8a84);--w3e:light-dark(#c3cec8,#5d6d65);--w3i:light-dark(#e2e9e5,#43514a);
  --lift:0 1px 2px rgba(16,24,20,.06),0 10px 28px rgba(16,24,20,.10);--r:14px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
select,button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Arbeitsfläche */
.fig{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none}
.fig>svg,.fig>canvas{position:absolute;inset:0;width:100%;height:100%}
.fig svg{cursor:crosshair}.fig svg.sel{cursor:default}

/* schwebende Flächen */
.float{position:fixed;z-index:3;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}

/* Kopfleiste */
.top{top:12px;left:12px;right:12px;height:56px;display:flex;align-items:center;gap:10px;padding:0 8px 0 6px}
.back{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--mute)}.back:hover{background:var(--paper);color:var(--ink)}
.title{border:0;background:none;font-size:17px;font-weight:700;letter-spacing:-.01em;padding:6px 26px 6px 6px;border-radius:10px;max-width:34ch;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.title:hover{background-color:var(--paper)}
.sync{font-size:12.5px;color:var(--mute);white-space:nowrap}.sync.ok{color:var(--mute)}.sync.warn{color:var(--warn)}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);margin-right:6px;vertical-align:1px}.sync.ok::before{background:var(--accent)}.sync.warn::before{background:var(--warn)}
.grow{flex:1}.sm{display:none}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--paper);border-radius:11px}
.seg button{border:0;background:none;min-height:34px;padding:0 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,20,.12)}
.btn,.pri{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.pri{background:var(--accent);border-color:transparent;color:light-dark(#fff,#04140d)}
.pri:hover{filter:brightness(1.06)}.btn:hover{border-color:var(--mute)}
.icon{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--mute)}.icon:hover{background:var(--paper);color:var(--ink)}
.icon[aria-pressed=true]{color:var(--ink)}
button:disabled{opacity:.35;cursor:default}

/* Werkzeugleiste links */
.rail{left:12px;top:80px;display:flex;flex-direction:column;gap:2px;padding:6px;width:68px}
.rail button{display:grid;justify-items:center;gap:2px;border:0;background:none;border-radius:10px;padding:8px 2px 6px;color:var(--mute);font-size:11px;font-weight:600}
.rail button:hover{color:var(--ink);background:var(--paper)}
.rail button[aria-pressed=true]{color:var(--accent);background:var(--soft)}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.rail svg,.icon svg,.zoom svg,.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Werkzeugoptionen oben in der Mitte */
.opts{top:80px;left:92px;right:calc(var(--pw) + 24px);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;width:max-content;max-width:calc(100vw - var(--pw) - 116px)}
.opts select,.opts input,.opts button{min-height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);padding:0 9px;font-size:14px}
.opts input{width:5.2em;font-variant-numeric:tabular-nums}
.opts button{font-weight:600}.opts button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.opts label{font-size:12.5px;color:var(--mute)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}

/* Zoom und Hinweis */
.zoom{left:12px;bottom:12px;display:flex;gap:2px;padding:4px}
.zoom button{display:grid;place-items:center;width:38px;height:38px;border:0;background:none;border-radius:9px;color:var(--mute)}.zoom button:hover{background:var(--paper);color:var(--ink)}
.hint{position:fixed;z-index:2;bottom:20px;left:50%;transform:translateX(calc(-50% - var(--pw) / 2));font-size:12.5px;color:var(--mute);pointer-events:none;white-space:nowrap;max-width:calc(100vw - var(--pw) - 220px);overflow:hidden;text-overflow:ellipsis}
.note{position:fixed;z-index:4;bottom:48px;left:50%;transform:translateX(calc(-50% - var(--pw) / 2));padding:10px 14px;font-size:14px;max-width:min(560px,calc(100vw - var(--pw) - 120px))}
.note:empty{display:none}
.note button{margin-left:8px}

/* Seitenleiste */
:root{--pw:372px}
body.nopanel{--pw:0px}
.panel{top:80px;right:12px;bottom:12px;width:360px;display:flex;flex-direction:column;overflow:hidden}
body.nopanel .panel{display:none}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;min-height:34px;padding:0 10px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mute);white-space:nowrap;position:relative}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);background:var(--paper)}
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;vertical-align:1px}
.pane{padding:14px 16px 18px;overflow:auto;flex:1}
.pane h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.pane .lead{color:var(--mute);font-size:14px;margin:0 0 12px}
.pane select,.pane input,.pane button{min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:0 10px;font-size:14.5px}
.pane input{font-variant-numeric:tabular-nums}
.pane button{font-weight:600}.pane button.pri{background:var(--accent);color:light-dark(#fff,#04140d);border-color:transparent}
.pane button.danger{color:var(--bad)}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--mute)}label.f>*{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 input,.grid2 select{width:100%}
.gridlab{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.gridlab label{font-size:12.5px;color:var(--mute);margin-top:8px;grid-row:span 1}.gridlab input,.gridlab select{width:100%}
/* Dach: Paare aus Beschriftung und Feld; lange Auswahlfelder über die ganze Breite */
.gridlab{grid-auto-flow:row dense}.gridlab>label{grid-column:span 2;margin-bottom:-2px}.gridlab>select,.gridlab>input{grid-column:span 2}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.wide{width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:12.5px}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.on td{background:var(--soft)}
tr:last-child td{border-bottom:0;font-weight:700}
.ok{color:var(--accent)}.no{color:var(--bad)}.warn{color:var(--warn)}
.small{font-size:13px;color:var(--mute)}
.msg{margin:10px 0 0;font-size:14px}
.pr{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0!important;background:none!important;padding:9px 6px!important;min-height:0!important;border-radius:9px!important;font-weight:400!important;cursor:pointer}
.pr+.pr{border-top:1px solid var(--line)!important;border-radius:0!important}
.pr:hover{background:var(--paper)!important}
.pr b{flex:0 0 2.4em;font-weight:700;font-size:12.5px;color:var(--mute)}
.pr span{flex:1;min-width:0;white-space:normal;font-size:14px}
.pr.warn{color:inherit}.pr.warn span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:7px;vertical-align:1px}
.stand{margin-top:22px;font-size:12px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:420px;box-shadow:var(--lift);padding:20px}
dialog::backdrop{background:rgba(10,16,13,.35)}
dialog .bar{justify-content:flex-end;margin-top:12px}
dialog button{min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:0 14px;font-weight:600}
dialog button.pri{background:var(--accent);color:light-dark(#fff,#04140d);border-color:transparent}

/* Tablet hochkant und Telefon: Seitenleiste als Blatt unten */
@media (max-width:860px){
  :root{--pw:0px}
  .top{left:8px;right:8px;top:8px;height:auto;min-height:52px;flex-wrap:wrap;padding:6px;row-gap:6px}
  .sync,.top .grow{display:none}
  .top .back{order:0}.top .title{order:1;flex:1 1 calc(100% - 100px);max-width:none}#panel-t{order:2}
  #floors{order:3}.top .views{order:4}#ifc{order:5;margin-left:auto}
  .rail{left:8px;top:auto;bottom:calc(42vh + 16px);width:auto;flex-direction:row;padding:4px}
  .rail button{padding:6px 8px 4px}
  .rail hr{border-top:0;border-left:1px solid var(--line);margin:4px 2px}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:42vh}
  body.nopanel .rail{bottom:16px}
  .zoom{left:auto;right:8px;bottom:calc(42vh + 16px)}body.nopanel .zoom{bottom:16px}
  .hint{display:none}
  .note{left:8px;right:8px;transform:none;max-width:none}
  .opts{top:auto;left:8px;right:8px;bottom:calc(42vh + 70px);max-width:none;width:auto}
  .note{top:auto;bottom:calc(42vh + 70px)}
}
@media (max-width:600px){
  .zoom{display:none!important}
  .rail{right:8px;justify-content:space-between}
  .seg button{padding:0 10px}
  #ifc{padding:0 12px}
  .lg{display:none}.sm{display:inline}
  .top .views{order:4}#ifc{order:5;margin-left:auto}
  .panel{height:36vh}.rail{bottom:calc(36vh + 16px)}
  .opts,.note{bottom:calc(36vh + 74px)}
}
@media (prefers-reduced-motion:no-preference){.seg button,.tabs button,.rail button{transition:background-color .15s,color .15s}}
</style>
</head>
<body>
<div class="fig" id="fig">
  <svg id="plan" role="img" aria-label="Grundriss des Gebäudemodells"></svg><canvas id="c3d" hidden></canvas>
</div>
<header class="float top">
  <a class="back" href="index.html" title="Zur Bestandsaufnahme" aria-label="Zur Bestandsaufnahme"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <select id="proj" class="title" aria-label="Projekt"></select>
  <span id="sync" class="sync">Verbinde …</span>
  <span class="grow"></span>
  <nav id="floors" class="seg" aria-label="Geschoss"></nav>
  <div class="seg views" role="group" aria-label="Ansicht"><button id="v2d" aria-pressed="true"><span class="lg">Grundriss</span><span class="sm">2D</span></button><button id="v3d" aria-pressed="false">3D</button><button id="vhaus" aria-pressed="false" title="Alle Geschosse übereinander mit Dach">Haus</button></div>
  <button class="pri" id="ifc" title="IFC-Datei für Raumtool 3D erzeugen"><span class="lg">IFC exportieren</span><span class="sm">IFC</span></button>
  <button class="icon" id="panel-t" aria-pressed="true" title="Seitenleiste ein- oder ausblenden" aria-label="Seitenleiste"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></svg></button>
</header>
<nav class="float rail" aria-label="Werkzeuge">
  <button id="t-sel" data-tool="sel" aria-pressed="true" title="Auswählen und Punkte ziehen"><svg viewBox="0 0 24 24"><path d="M6 3.5l12 6.8-5.3 1.4-2.6 5.3z"/></svg><span>Auswahl</span></button>
  <button id="t-wall" data-tool="wall" aria-pressed="false" title="Wände zeichnen"><svg viewBox="0 0 24 24"><path d="M3.5 8.5h17v7h-17z"/><path d="M3.5 12h17" stroke-dasharray="2 2.2" stroke-width="1.2"/></svg><span>Wand</span></button>
  <button id="t-open" data-tool="open" aria-pressed="false" title="Fenster und Türen setzen"><svg viewBox="0 0 24 24"><path d="M3 9h5v6H3zM16 9h5v6h-5z"/><path d="M8 12h8" stroke-width="1.2"/></svg><span>Öffnung</span></button>
  <hr>
  <button id="undo" title="Rückgängig (Strg+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4.5 9.5 9 5"/><path d="M4.5 9.5H14a5.5 5.5 0 010 11h-3"/></svg><span>Zurück</span></button>
  <button id="redo" title="Wiederholen (Strg+Y)" disabled><svg viewBox="0 0 24 24"><path d="M15 14l4.5-4.5L15 5"/><path d="M19.5 9.5H10a5.5 5.5 0 000 11h3"/></svg><span>Vor</span></button>
</nav>
<div class="float opts" id="wallbar" hidden>
  <select id="w-typ" aria-label="Wandtyp"><option value="aussen">Außenwand</option><option value="innen">Innenwand</option></select>
  <label for="w-t">Dicke cm</label><input id="w-t" inputmode="decimal" value="36,5">
  <select id="w-bezug" aria-label="Bezug der Maße"><option value="innen">Maße innen</option><option value="mitte">Maße Wandmitte</option><option value="aussen">Maße außen</option></select>
  <button id="w-ortho" aria-pressed="true" title="Nur rechte Winkel">90°</button>
  <span class="sep"></span>
  <label for="w-len">Länge m</label><input id="w-len" inputmode="decimal" placeholder="8,49">
  <button data-dir="0" title="nach rechts" aria-label="nach rechts">→</button><button data-dir="90" title="nach unten" aria-label="nach unten">↓</button><button data-dir="180" title="nach links" aria-label="nach links">←</button><button data-dir="270" title="nach oben" aria-label="nach oben">↑</button>
  <button id="w-done">Fertig</button>
</div>
<div class="float opts" id="openbar" hidden>
  <select id="o-typ" aria-label="Öffnungstyp"><option value="fenster">Fenster</option><option value="fenstertuer">Fenstertür</option><option value="innentuer">Innentür</option><option value="aussentuer">Außentür</option></select>
  <label for="o-b">Breite m</label><input id="o-b" inputmode="decimal" value="1,20">
  <label for="o-h">Höhe m</label><input id="o-h" inputmode="decimal" value="1,40">
  <label for="o-brh">Brüstung m</label><input id="o-brh" inputmode="decimal" value="0,90">
</div>
<div class="float zoom" id="zoombox"><button id="z-in" aria-label="Vergrößern" title="Vergrößern"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="z-out" aria-label="Verkleinern" title="Verkleinern"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="z-fit" aria-label="Ganzen Grundriss zeigen" title="Ganzen Grundriss zeigen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
<div class="hint" id="hint"></div>
<p class="float note msg" id="saveinfo" role="status"></p>
<aside class="float panel" id="panel">
  <div class="tabs" role="tablist" aria-label="Seitenleiste">
    <button role="tab" data-tab="auswahl" aria-selected="true">Auswahl</button><button role="tab" data-tab="raeume" aria-selected="false">Räume</button><button role="tab" data-tab="pruefung" aria-selected="false" id="tab-pruef">Prüfung</button><button role="tab" data-tab="dach" aria-selected="false">Dach</button><button role="tab" data-tab="datei" aria-selected="false">Datei</button>
  </div>
  <section class="pane" data-pane="auswahl" id="props"><h2>Auswahl</h2><p class="lead">Wand, Öffnung oder Raum antippen.</p></section>
  <section class="pane" data-pane="raeume" hidden><h2>Räume</h2><div id="rooms"></div></section>
  <section class="pane" data-pane="pruefung" id="pruefcard" hidden><h2 id="pruef-h">Prüfung</h2><div id="pruef"></div></section>
  <section class="pane" data-pane="dach" id="dachcard" hidden><h2>Dach</h2>
    <div class="gridlab">
      <label for="d-form">Form</label><select id="d-form"><option value="sattel">Satteldach</option><option value="walm">Walmdach</option><option value="zelt">Zeltdach</option><option value="pult">Pultdach</option><option value="flach">Flachdach</option><option value="kein">kein Dach</option></select>
      <label for="d-neig">Neigung °</label><input id="d-neig" inputmode="decimal">
      <label for="d-first">First</label><select id="d-first"><option value="lang">parallel zur langen Seite</option><option value="quer">parallel zur kurzen Seite</option></select>
      <label for="d-knie">Kniestock cm</label><input id="d-knie" inputmode="decimal">
      <label for="d-ut">Überstand Traufe cm</label><input id="d-ut" inputmode="decimal">
      <label for="d-uo">Überstand Ortgang cm</label><input id="d-uo" inputmode="decimal">
      <label for="d-dicke">Dachaufbau cm</label><input id="d-dicke" inputmode="decimal">
      <label for="d-teile">Grundriss</label><select id="d-teile"><option value="auto">in Rechtecke zerlegen (L, T, U, Anbauten)</option><option value="rechteck">ein Rechteck um alles</option></select>
      <label for="d-bezug">Dach sitzt</label><select id="d-bezug"><option value="decke">auf der obersten Geschossdecke (kalter Dachraum)</option><option value="boden">auf dem obersten Geschoss (ausgebautes Dach)</option></select>
    </div>
    <p class="small" id="d-info"></p>
  </section>
  <section class="pane" data-pane="datei" hidden><h2>Datei</h2>
    <p class="lead">Änderungen werden automatisch auf diesem Gerät gespeichert. Der Export legt die IFC-Datei für Raumtool 3D und die Prüfdaten nebeneinander ab.</p>
    <div class="bar"><button class="pri" id="save">Jetzt speichern</button><button id="reimport" title="Modell aus den Räumen der Bestandsaufnahme neu erzeugen">Aus Bestandsaufnahme neu erzeugen</button></div>
    <p class="stand" id="stand" title="Programmstand">Stand __BUILD__</p>
  </section>
</aside>
<dialog id="dlg"><p id="dlg-t"></p><div class="bar"><button id="dlg-no">Abbrechen</button><button class="pri" id="dlg-yes">Übernehmen</button></div></dialog>
<script>/*CORE*/</script>
<script>/*IFC*/</script>
<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
